<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Documenti in scadenza – ProFile Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stile.css">
<style>
.th{display:block;width:100%;height:72px;object-fit:cover;border-radius:6px;background:#fff}
.fi .th{width:36px;height:36px;border-radius:5px}
.frow{flex-wrap:wrap}
.frow .fi{width:auto;min-width:1.8rem}
.frow .fn{flex:1 1 180px}
.sm2{font-size:.78rem}
.cd{background:var(--er);color:var(--bg);font-weight:700;border-radius:99px;padding:3px 12px;white-space:nowrap;font-size:.85rem}
.ttl.alarm{color:var(--er)}
.card.alarm{border:2px solid var(--er);border-left-width:8px}
.card.alarm b{color:var(--er)}
.dlg input[type=file],.dlg input[type=date]{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);min-height:44px}
</style>
</head>
<body>
<div id="app"></div>
<div id="prog" role="status"></div>
<div id="memo"></div>
<div class="clock" id="clock"></div>
<script type="module" src="in-scadenza.js"></script>
</body>
</html>
