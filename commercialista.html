<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commercialista – ProFile Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stile.css">
<style>
.fh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hd{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.lgbox{background:#1B2A4A;border-radius:12px;padding:8px 12px;display:inline-flex;flex:none}
.lgbox img{height:64px;width:auto;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
@media (max-width:560px){.two,.three{grid-template-columns:1fr}}
input[type=date],input[type=time]{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);min-height:44px}
input[type=text]{min-height:44px}
textarea{width:100%;min-height:80px;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);resize:vertical}
fieldset{border:1px solid var(--ln);border-radius:10px;margin:14px 0 0;padding:2px 14px 14px}
legend{padding:0 6px;font-weight:700;font-size:.9rem;color:var(--ac)}
.acts{display:flex;flex-direction:row;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;margin:0 0 14px}
.tabs .seg{width:100%}
.tabs .seg{display:flex}
.tabs .seg button{flex:1;min-width:0;padding:10px 6px;font-size:.9rem}
@media (max-width:420px){.tabs .seg button{padding:10px 2px;font-size:.8rem}}
.chip{font-size:.72rem;padding:2px 8px;border-radius:99px;border:1px solid var(--ln);white-space:nowrap;color:var(--mu)}
.chip.bad{border-color:var(--er);color:var(--er);font-weight:700}
.chip.warn{border-color:var(--ac2);color:var(--tx);font-weight:700}

button.chip{background:none;cursor:pointer;color:var(--tx);font:inherit;font-size:.78rem;min-height:30px;padding:3px 10px;margin:3px 4px 0 0}
button.chip:hover{border-color:var(--ac)}
h3.rh{margin:20px 0 6px;font-size:1rem}
.ck2{display:flex;gap:8px;align-items:center}
/* Bilancio */
.sums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
@media (max-width:560px){.sums{grid-template-columns:1fr}}
.sum{background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--ac2);border-radius:10px;padding:12px 14px}
.sum .l{font-size:.8rem;color:var(--mu)}
.sum .v{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.sum .s{font-size:.78rem;color:var(--mu)}
.neg{color:var(--er)}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.flt select{width:auto;min-height:40px}
.flt input[type=search]{flex:1;min-width:140px;min-height:40px}
.mv{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--ln)}
.mv:last-child{border:0}
.mv .dt{flex:none;width:5.2em;font-size:.82rem;color:var(--mu);font-variant-numeric:tabular-nums}
.mv .inf{flex:1 1 auto;min-width:0;line-height:1.3}
.mv .inf>div{overflow-wrap:anywhere}
.mv .am{flex:none;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.mv .am small{display:block;font-weight:400;color:var(--mu);font-size:.72rem}
.mv .ac{display:flex;gap:4px;flex:none}
@media (max-width:560px){.mv{flex-wrap:wrap}.mv .dt{width:auto}.mv .ac{width:100%;justify-content:flex-end}}
details.cat{margin-top:12px}
details.cat summary{cursor:pointer;color:var(--ac);font-weight:700;font-size:.9rem}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}

/* Calcolatrice */
.calc{max-width:360px;margin:0 auto}
.calc .disp{width:100%;font-size:1.6rem;text-align:right;padding:12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);min-height:56px;font-variant-numeric:tabular-nums}
.calc .prev{min-height:1.6em;text-align:right;color:var(--mu);font-size:1.05rem;margin:4px 4px 8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{min-height:54px;font-size:1.2rem;border:1px solid var(--ln);border-radius:10px;background:var(--sf);font-weight:500}
.keys button:active{background:var(--bg)}
.keys button.op{background:var(--bg);color:var(--ac);font-weight:700}
.keys button.eq{background:var(--ac);color:var(--bg);font-weight:700}
.keys button.cl{color:var(--er);font-weight:700}
.ivar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ivar select{width:auto;min-height:40px}
.hist{margin-top:14px}
.hist button{display:block;width:100%;text-align:right;background:none;border:0;border-bottom:1px solid var(--ln);padding:6px 2px;font-variant-numeric:tabular-nums;font-size:.92rem}
.hist .e{color:var(--mu);font-size:.8rem;display:block}

/* Calendario */
.cnav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cnav b{flex:1;text-align:center;text-transform:capitalize}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cgrid .wd{text-align:center;font-size:.75rem;color:var(--mu);padding:2px 0}
.cd{position:relative;min-height:48px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);padding:4px 2px;font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.cd.out{opacity:.4}
.cd.today{border-color:var(--ac);border-width:2px;font-weight:700}
.cd.sel{background:var(--ac);color:var(--bg)}
.cd .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cd .dot{width:6px;height:6px;border-radius:50%;background:var(--ac2)}
.cd .dot.al{background:var(--er)}
.nt{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid var(--ln)}
.nt:last-child{border:0}
.nt input[type=checkbox]{width:20px;height:20px;margin-top:3px;flex:none;min-height:0}
.nt .inf{flex:1;min-width:0;line-height:1.3}
.nt .inf .tt.done{text-decoration:line-through;color:var(--mu)}
.nt .inf .tx{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9rem}
.nt .ac{display:flex;gap:4px;flex:none}
#al .card{border-color:var(--er);margin-bottom:12px;padding:12px 14px}
#al h3{margin:0 0 6px;font-size:1rem;color:var(--er)}
#al .ar{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--ln)}
#al .ar:first-of-type{border-top:0}
#al .ar .inf{flex:1;min-width:0;line-height:1.3}
</style>
<script src="tema.js"></script>
</head>
<body>
<div id="app"></div>
<div id="memo"></div>
<div class="clock" id="clock"></div>
<script type="module" src="commercialista.js"></script>
</body>
</html>
