<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esami – ProFile Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stile.css">
<style>
.th{display:block;width:100%;height:72px;object-fit:cover;border-radius:6px;background:#fff}
.fi .th{width:36px;height:36px;border-radius:5px}
.frow .fi{width:auto;min-width:1.8rem}
.cats{display:flex;flex-direction:column;gap:8px}
.cat{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:52px;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf,#fff);color:inherit;font:inherit;cursor:pointer}
.cat:hover{border-color:var(--ac2,#B8A24A)}
.cat .nm{flex:1;min-width:0}
.cat .nm b{display:block}
.cat .n{flex:none;font-size:.85rem;color:var(--mu)}
.belt{flex:none;display:inline-block;width:44px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.beltS{width:30px;height:10px;vertical-align:middle;margin-right:6px}
.note{padding:10px 12px;border-radius:8px;border:1px solid var(--ln);margin-bottom:12px;font-size:.9rem}
.seg2{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.seg2 button{min-height:36px;padding:4px 12px;border:1px solid var(--ln);border-radius:999px;background:transparent;color:inherit;font:inherit;font-size:.85rem}
.seg2 button[aria-pressed=true]{background:var(--ac2,#B8A24A);color:#fff;border-color:transparent}
</style>
</head>
<body>
<div id="app"></div>
<div id="prog" role="status"></div>
<div id="memo"></div>
<div class="clock" id="clock"></div>
<script type="module" src="esami.js"></script>
</body>
</html>
