<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProFile Manager – Yanagi Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F4;--sf:#fff;--tx:#14213D;--mu:#5B6780;--ac:#1B2A4A;--ac2:#B8A24A;--ln:#D3D9E3;--er:#B3261E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1626;--sf:#17233A;--tx:#E8ECF4;--mu:#9AA7C0;--ac:#8FA8DC;--ac2:#D6C26A;--ln:#2A3A58;--er:#FF8A80}}
:root[data-theme="dark"]{--bg:#0E1626;--sf:#17233A;--tx:#E8ECF4;--mu:#9AA7C0;--ac:#8FA8DC;--ac2:#D6C26A;--ln:#2A3A58;--er:#FF8A80}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:400 16px/1.5 "Zen Kaku Gothic New",system-ui,sans-serif;padding-bottom:56px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:20px}
.login{max-width:360px;margin:12vh auto 0}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.2rem;margin:0 0 12px}
.mu{color:var(--mu);font-size:.9rem}
label{display:block;margin:12px 0 4px;font-size:.9rem;color:var(--mu)}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg)}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:8px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.err{color:var(--er);min-height:1.4em;margin:8px 0 0;font-size:.9rem}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:10px 16px;display:flex;gap:10px;align-items:center}
.top input{flex:1;min-width:0}
.top .who{white-space:nowrap;font-size:.85rem;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:8px}
.gt{margin:24px 0 0;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.alert{margin-top:16px;border:2px solid var(--er);border-left-width:8px}
.alert h2{color:var(--er);margin-bottom:4px}
.tile{background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--ac2);border-radius:10px;padding:18px 14px;text-align:left;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-size:1.05rem}
.tile:hover{border-color:var(--ac)}
.tile[disabled]{opacity:.45;cursor:not-allowed}
.tile.alarm{background:var(--er);border-color:var(--er);color:var(--bg)}
.tile.alarm .badge{color:inherit;font-weight:700}
.badge{font-size:.78rem;color:var(--mu)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.res{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);padding:10px 0}
.clock{position:fixed;right:0;bottom:0;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:1px solid var(--ln);border-left:1px solid var(--ln);border-radius:10px 0 0 0;font-size:.9rem;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--ln)}
.scroll{overflow-x:auto}
.bar{display:flex;gap:8px;align-items:center;margin:16px 0 12px;flex-wrap:wrap}
.bar h2{margin:0;flex:1}
.acc{border:1px solid var(--ln);border-radius:10px;padding:12px 14px;margin-top:10px}
.acc-h{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.acc-a{display:flex;gap:10px;align-items:center}
.acc details,#ned details{border:1px solid var(--ln);border-radius:8px;margin-top:8px;padding:0 12px 8px}
.acc summary,#ned summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}
.ck{display:flex;gap:8px;align-items:center;min-height:40px}
.ck input{width:auto;min-height:0}
.gt2{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin-top:8px}
.pr{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--ln)}
.pr:last-child{border:0}
.pr select{width:auto;min-width:130px}
</style>
</head>
<body>
<div id="app"></div>
<div class="clock" id="clock" aria-live="off"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,collection,onSnapshot,setDoc,updateDoc,deleteDoc,addDoc,getDoc,serverTimestamp} from "./fsx.js";

import {firebaseConfig} from "./firebase-config.js";
import {inScadenza} from "./scadenze.js";
import {testDaFare,eventoInScadenza,tesseraAlert} from "./atleti-scadenze.js";
import {archiviato,zona,archiviaScaduti} from "./conservazione.js";

/* Home organizzata per gruppi. SEC (elenco piatto) resta la base di permessi, ricerca e tabella account */
const GROUPS=[['Documenti e archivio',['Documenti','File importanti','Documenti in scadenza','Archivio']],['Persone',['Tecnici','Atleti','Tessere']],['Attività',['Lezioni','Eventi']],['Media',['Video','Foto']],['Amministrazione',['Commercialista']],['Comunicazione',['Mail']]];
const SEC=GROUPS.flatMap(g=>g[1]);
const key=s=>s.toLowerCase().replace(/\s+/g,'-');
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let fa,auth,db,uid=null,me=null,accounts=[],items={},view='home',q='',unsubs=[],unsubUsers=null,unsubMe=null;
const page=s=>key(s)+'.html';
const perm=s=>me?(me.admin?'w':((me.perms||{})[key(s)]||'n')):'n';
const allItems=()=>SEC.flatMap(s=>(items[key(s)]||[]).map(i=>({...i,sec:s}))).filter(i=>!i.lesson&&!i.evento&&(!i.tesAtl||i.archiviatoIl)&&(!i.archiviatoIl||perm('Archivio')!=='n')).map(i=>i.archiviatoIl?{...i,sec:'Archivio'}:i);
/* File importanti = documenti con la stella (da Documenti) + eventuali voci inserite a mano; Lezioni = solo le lezioni, senza i file allegati */
const count=s=>{const k=key(s),its=items[k]||[];
  if(k==='file-importanti')return (items.documenti||[]).filter(i=>i.star).length+its.length;
  if(k==='documenti')return its.filter(i=>!i.archiviatoIl).length;
  if(k==='archivio')return [...(items.documenti||[]),...(items.tessere||[])].filter(archiviato).length;
  if(k==='documenti-in-scadenza')return (items.documenti||[]).filter(inScadenza).length;
  if(k==='lezioni')return its.filter(i=>i.kind!=='file').length;
  if(k==='eventi')return its.filter(i=>i.kind==='evento').length;
  if(k==='tessere')return its.filter(i=>i.kind==='tessera').length;
  return its.length};

if(firebaseConfig.apiKey==='INSERISCI'){app.innerHTML=box('Firebase non ancora collegato','Apri index.html e incolla i dati del progetto Firebase in firebaseConfig. Poi ricarica la pagina.')}
else{fa=initializeApp(firebaseConfig);auth=getAuth(fa);db=getFirestore(fa);
  onAuthStateChanged(auth,u=>{cleanup();uid=u?u.uid:null;me=null;if(!u){loginView();return}
    unsubMe=onSnapshot(doc(db,'users',uid),sn=>{me=sn.exists()?{id:uid,...sn.data()}:null;onMe()},()=>{app.innerHTML=box('Errore di connessione','Impossibile leggere l’account. Riprova tra poco.')})})}

function box(t,m,extra=''){return`<div class="wrap"><div class="card login"><h1>ProFile Manager</h1><h2 style="margin-top:12px">${esc(t)}</h2><div class="mu">${esc(m)}</div>${extra}</div></div>`}
function cleanup(){mio=false;unsubs.forEach(f=>f());unsubs=[];if(unsubMe)unsubMe();if(unsubUsers)unsubUsers();unsubMe=unsubUsers=null;items={};accounts=[]}
let mio=false;
/* atleta con tessera: l'email dell'account coincide con quella inserita dall'admin nella scheda Atleti */
function cercaMio(){const e=auth.currentUser&&auth.currentUser.email;if(!e)return;getDoc(doc(db,'atletiEmail',e.toLowerCase())).then(s=>{if(s.exists()!==mio){mio=s.exists();render()}}).catch(()=>{})}
function onMe(){
  unsubs.forEach(f=>f());unsubs=[];if(unsubUsers){unsubUsers();unsubUsers=null}
  if(!me){app.innerHTML=box('Account non abilitato','Hai effettuato l’accesso ma un admin deve ancora abilitarti.','<p><button class="btn ghost" id="out">Esci</button></p>');$('#out').onclick=()=>signOut(auth);return}
  SEC.forEach(s=>{if(perm(s)!=='n')unsubs.push(onSnapshot(collection(db,'sections',key(s),'items'),sn=>{items[key(s)]=sn.docs.map(d=>({id:d.id,...d.data()}));if(key(s)==='documenti'&&perm('Documenti')==='w')archiviaScaduti(db,items.documenti);render()},()=>{}))});
  if(me.admin)unsubUsers=onSnapshot(collection(db,'users'),sn=>{accounts=sn.docs.map(d=>({id:d.id,...d.data()}));render()});
  cercaMio();render();
}
function loginView(){
  app.innerHTML=box('Accedi','Inserisci le credenziali fornite dall’admin.',`<label for="em">Email</label><input id="em" type="text" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><p class="err" id="er" role="alert"></p><button class="btn" id="go">Accedi</button>`);
  const go=async()=>{try{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}catch(e){$('#er').textContent='Email o password non corretti.'}};
  $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};$('#em').focus();
}
function render(){
  if(!me)return;const f=document.activeElement&&document.activeElement.id==='q';
  if(view==='admin'&&me.admin)adminView();else{view='home';homeView()}
  if(f){const i=$('#q');if(i){i.focus();i.setSelectionRange(q.length,q.length)}}
}
const topbar=()=>`<div class="top"><input id="q" type="search" placeholder="Cerca in tutte le sezioni" aria-label="Cerca" value="${esc(q)}"><a class="btn ghost sm" href="chat.html" style="text-decoration:none">Chat</a>${me.admin?'<button class="btn ghost sm" id="adm">Account</button>':''}<span class="who">${esc(me.name||me.email||'')}</span><button class="btn ghost sm" id="out">Esci</button></div>`;
function bindTop(){$('#q').oninput=e=>{q=e.target.value;if(view!=='home'){view='home';render()}else results()};
  $('#out').onclick=()=>{q='';view='home';signOut(auth)};if($('#adm'))$('#adm').onclick=()=>{view='admin';render()}}
function homeView(){app.innerHTML=topbar()+'<div class="wrap"><div id="body"></div></div>';bindTop();results()}
function results(){
  const t=q.trim().toLowerCase(),b=$('#body');
  if(!t){b.innerHTML=mioHtml()+alertsHtml()+GROUPS.map(groupHtml).join('')+adminHtml();bindTiles();bindRes(b);return}
  const secs=SEC.filter(s=>perm(s)!=='n'&&s.toLowerCase().includes(t));
  const hits=allItems().filter(i=>(i.title+' '+(i.note||'')).toLowerCase().includes(t));
  b.innerHTML=`<div class="grid">${secs.map(tile).join('')}</div><div class="card" style="margin-top:16px"><h2>Risultati (${hits.length})</h2>${hits.length?hits.map(i=>`<button class="res" data-s="${esc(i.sec)}"><b>${esc(i.title)}</b><div class="mu">${esc(i.sec)}${i.note?' – '+esc(i.note):''}</div></button>`).join(''):'<div class="mu">Nessun elemento trovato nelle sezioni a cui hai accesso.</div>'}</div>`;
  bindTiles();bindRes(b);
}
const mioHtml=()=>mio?'<h3 class="gt">Area personale</h3><div class="grid"><a class="tile" href="atleti.html" style="text-decoration:none;color:inherit"><b>Atleti</b><span class="badge">La mia tessera e il certificato</span></a></div>':'';
/* Strumenti riservati all'admin (visibili solo a lui) */
const adminHtml=()=>me.admin?'<h3 class="gt">Strumenti admin</h3><div class="grid"><a class="tile" href="migra.html" style="display:block;text-decoration:none;text-align:left;color:inherit"><b>Migrazione su Telegram</b><span class="badge">Una tantum · solo admin</span></a></div>':'';
const bindRes=b=>b.querySelectorAll('.res').forEach(r=>r.onclick=()=>{location.href=page(r.dataset.s)});
const groupHtml=g=>g[1].every(s=>perm(s)==='n')?'':`<h3 class="gt">${esc(g[0])}</h3><div class="grid">${g[1].map(tile).join('')}</div>`;
/* Riquadro "Da controllare" in cima alla Home: documenti in scadenza e documenti da verificare in Archivio */
function alertsHtml(){
  const a=[];
  if(perm('Documenti in scadenza')!=='n'){const n=count('Documenti in scadenza');if(n)a.push(['Documenti in scadenza',n+(n===1?' documento in scadenza':' documenti in scadenza')])}
  if(perm('Atleti')!=='n'){const n=(items.atleti||[]).filter(testDaFare).length;if(n)a.push(['Atleti',n+(n===1?' atleta con test da fare':' atleti con test da fare')])}
  if(perm('Tessere')!=='n'){const n=(items.tessere||[]).filter(tesseraAlert).length;if(n)a.push(['Tessere',n+(n===1?' atleta con tessera o certificato in scadenza':' atleti con tessera o certificato in scadenza')])}
  if(perm('Eventi')!=='n'){const n=(items.eventi||[]).filter(eventoInScadenza).length;if(n)a.push(['Eventi',n+(n===1?' evento con iscrizione in scadenza':' eventi con iscrizione in scadenza')])}
  if(perm('Archivio')!=='n'){const k=[...(items.documenti||[]),...(items.tessere||[])].filter(i=>zona(i)==='verifica').length;if(k)a.push(['Archivio',k+(k===1?' documento da verificare':' documenti da verificare')])}
  return a.length?`<div class="card alert" role="status"><h2>Da controllare</h2>${a.map(([s,t])=>`<button class="res" data-s="${esc(s)}"><b>${esc(t)}</b><div class="mu">Apri ${esc(s)}</div></button>`).join('')}</div>`:''}
function tile(s){const p=perm(s),n=count(s),ver=key(s)==='archivio'?[...(items.documenti||[]),...(items.tessere||[])].filter(i=>zona(i)==='verifica').length:0,nt=key(s)==='atleti'?(items.atleti||[]).filter(testDaFare).length:0,ne=key(s)==='eventi'?(items.eventi||[]).filter(eventoInScadenza).length:0,ntes=key(s)==='tessere'?(items.tessere||[]).filter(tesseraAlert).length:0,hot=p!=='n'&&((key(s)==='documenti-in-scadenza'&&n>0)||nt>0||ne>0||ntes>0);return`<button class="tile${hot?' alarm':''}" data-s="${esc(s)}" ${p==='n'?'disabled':''}><b>${esc(s)}</b><span class="badge">${p==='n'?'Nessun accesso':(p==='w'?'Lettura e scrittura':'Solo lettura')}${p!=='n'?' · '+n+(hot&&!nt&&!ne&&!ntes?' in scadenza':'')+(ntes?' · '+ntes+' in scadenza':'')+(ne?' · '+ne+' in scadenza':'')+(nt?' · '+nt+' test da fare':'')+(ver?' · '+ver+' da verificare':''):''}</span></button>`}
function bindTiles(){document.querySelectorAll('.tile:not([disabled])').forEach(t=>t.onclick=()=>{location.href=page(t.dataset.s)})}
/* Gestione account: per ogni account due menu a tendina.
   "Schede visibili" = quali sezioni vede (casella spuntata = visibile, altrimenti perms[sezione]='n');
   "Permessi" = per ogni scheda visibile, Lettura o Scrittura (perms[sezione]='r'|'w'). Le regole Firestore non cambiano. */
const openDet=new Set();let newPerms={};
function editorHtml(id,perms,dis){
  const lvl=s=>dis?'w':((perms||{})[key(s)]||'n'),vis=s=>lvl(s)!=='n',sv=SEC.filter(vis);
  const od=w=>openDet.has(id+'|'+w)?' open':'';
  return `<details data-d="${esc(id)}|v"${od('v')}><summary>Schede visibili&nbsp;<span class="mu">(${sv.length}/${SEC.length})</span></summary>
    ${dis?'<p class="mu" style="margin:0 0 8px">Gli admin vedono tutte le schede.</p>':''}
    ${GROUPS.map(g=>`<div class="gt2">${esc(g[0])}</div>${g[1].map(s=>`<label class="ck"><input type="checkbox" data-pk="${esc(key(s))}" data-sc="${esc(id)}" ${vis(s)?'checked':''} ${dis?'disabled':''}> ${esc(s)}</label>`).join('')}`).join('')}</details>
  <details data-d="${esc(id)}|p"${od('p')}><summary>Permessi</summary>
    ${dis?'<p class="mu" style="margin:0 0 8px">Gli admin hanno sempre scrittura su tutte le schede.</p>':''}
    ${sv.length?sv.map(s=>`<div class="pr"><span>${esc(s)}</span><select data-pl="${esc(key(s))}" data-sc="${esc(id)}" aria-label="Permesso ${esc(s)}" ${dis?'disabled':''}>${[['r','Lettura'],['w','Scrittura']].map(([v,l])=>`<option value="${v}" ${lvl(s)===v?'selected':''}>${l}</option>`).join('')}</select></div>`).join(''):'<p class="mu">Nessuna scheda visibile: attivane almeno una in “Schede visibili”.</p>'}</details>`}
function bindEd(root){
  root.querySelectorAll('details[data-d]').forEach(d=>d.ontoggle=()=>{d.open?openDet.add(d.dataset.d):openDet.delete(d.dataset.d)});
  root.querySelectorAll('input[data-pk]').forEach(c=>c.onchange=()=>setPerm(c.dataset.sc,c.dataset.pk,c.checked?'r':'n'));
  root.querySelectorAll('select[data-pl]').forEach(x=>x.onchange=()=>setPerm(x.dataset.sc,x.dataset.pl,x.value))}
function setPerm(sc,k,v){
  if(sc==='new'){if(v==='n')delete newPerms[k];else newPerms[k]=v;paintNew();return}
  updateDoc(doc(db,'users',sc),{['perms.'+k]:v}).catch(()=>{const e=$('#er2');if(e)e.textContent='Modifica non riuscita. Riprova.'})}
function paintNew(){const n=$('#ned');if(!n)return;n.innerHTML=editorHtml('new',newPerms,$('#na')&&$('#na').checked);bindEd(n)}
function adminView(){
  const adminsLeft=accounts.filter(a=>a.admin).length;
  const keep=['#nn2','#ne','#np'].map(i=>$(i)?$(i).value:''),keepA=$('#na')?$('#na').checked:false;
  app.innerHTML=topbar()+`<div class="wrap"><div class="bar"><button class="btn ghost sm" id="bk">Indietro</button><h2>Gestione account</h2></div>
  <div class="card"><h2 style="margin:0">Account (${accounts.length})</h2>
  ${accounts.map(a=>`<div class="acc"><div class="acc-h"><div><b>${esc(a.name||'—')}</b><div class="mu">${esc(a.email||'')}</div></div><div class="acc-a"><label class="ck"><input type="checkbox" data-a="${esc(a.id)}" ${a.admin?'checked':''}> Admin</label><button class="btn ghost sm" data-x="${esc(a.id)}">Rimuovi</button></div></div>${editorHtml(a.id,a.perms,!!a.admin)}</div>`).join('')}
  <p class="err" id="er2" role="alert"></p><p class="mu">Gli admin hanno sempre scrittura su tutte le schede. Per impostare schede e permessi specifici, togli prima il ruolo admin. “Rimuovi” revoca l’accesso; per cancellare anche il login usa la console Firebase.</p></div>
  <div class="card" style="margin-top:12px"><h2>Nuovo account</h2><label for="nn2" style="margin-top:0">Nome</label><input id="nn2" type="text"><label for="ne">Email</label><input id="ne" type="text" autocomplete="off"><label for="np">Password iniziale (min. 6 caratteri)</label><input id="np" type="password" autocomplete="new-password"><label class="ck" style="margin-top:8px"><input type="checkbox" id="na"> Admin</label><div id="ned" style="margin-top:4px"></div><p class="err" id="er" role="alert"></p><button class="btn" id="cr">Crea account</button></div></div>`;
  $('#nn2').value=keep[0];$('#ne').value=keep[1];$('#np').value=keep[2];$('#na').checked=keepA;
  paintNew();bindEd(app);$('#na').onchange=paintNew;
  bindTop();$('#bk').onclick=()=>{view='home';render()};
  document.querySelectorAll('[data-a]').forEach(c=>c.onchange=()=>{if(!c.checked&&adminsLeft<2){c.checked=true;$('#er2').textContent='Deve restare almeno un admin.';return}updateDoc(doc(db,'users',c.dataset.a),{admin:c.checked}).catch(()=>{})});
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const a=accounts.find(z=>z.id===b.dataset.x);if(a.admin&&adminsLeft<2){$('#er2').textContent='Non puoi rimuovere l’ultimo admin.';return}if(confirm('Revocare l’accesso a '+(a.name||a.email)+'?'))deleteDoc(doc(db,'users',a.id)).catch(()=>{})});
  $('#cr').onclick=async()=>{const n=$('#nn2').value.trim(),e=$('#ne').value.trim(),p=$('#np').value,er=$('#er');
    if(!n||!e||p.length<6){er.textContent='Inserisci nome, email e una password di almeno 6 caratteri.';return}
    try{const sec=initializeApp(firebaseConfig,'sec'+Date.now()),sa=getAuth(sec);
      const c=await createUserWithEmailAndPassword(sa,e,p);const nid=c.user.uid;await signOut(sa);
      await setDoc(doc(db,'users',nid),{name:n,email:e,admin:$('#na').checked,perms:$('#na').checked?{}:{...newPerms}});
      $('#nn2').value=$('#ne').value=$('#np').value='';$('#na').checked=false;newPerms={};paintNew();er.textContent='';
    }catch(x){er.textContent=x.code==='auth/email-already-in-use'?'Esiste già un account con questa email.':'Creazione non riuscita. Controlla i dati e riprova.'}};
}
function tick(){const d=new Date();$('#clock').textContent=d.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'long',year:'numeric'})+' · '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}
tick();setInterval(tick,15000);
</script>
