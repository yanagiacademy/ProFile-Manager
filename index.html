<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProFile Manager – Yanagi Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F4;--sf:#fff;--tx:#14213D;--mu:#5B6780;--ac:#1B2A4A;--ac2:#B8A24A;--ln:#D3D9E3;--er:#B3261E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1626;--sf:#17233A;--tx:#E8ECF4;--mu:#9AA7C0;--ac:#8FA8DC;--ac2:#D6C26A;--ln:#2A3A58;--er:#FF8A80}}
:root[data-theme="dark"]{--bg:#0E1626;--sf:#17233A;--tx:#E8ECF4;--mu:#9AA7C0;--ac:#8FA8DC;--ac2:#D6C26A;--ln:#2A3A58;--er:#FF8A80}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:400 16px/1.5 "Zen Kaku Gothic New",system-ui,sans-serif;padding-bottom:56px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:20px}
.login{max-width:360px;margin:12vh auto 0}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.2rem;margin:0 0 12px}
.mu{color:var(--mu);font-size:.9rem}
label{display:block;margin:12px 0 4px;font-size:.9rem;color:var(--mu)}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg)}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:8px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.err{color:var(--er);min-height:1.4em;margin:8px 0 0;font-size:.9rem}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.clock{position:fixed;right:0;bottom:0;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:1px solid var(--ln);border-left:1px solid var(--ln);border-radius:10px 0 0 0;font-size:.9rem;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--ln)}
.scroll{overflow-x:auto}
.bar{display:flex;gap:8px;align-items:center;margin:16px 0 12px;flex-wrap:wrap}
.bar h2{margin:0;flex:1}
.acc{border:1px solid var(--ln);border-radius:10px;padding:12px 14px;margin-top:10px}
.acc-h{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.acc-a{display:flex;gap:10px;align-items:center}
.acc details,#ned details{border:1px solid var(--ln);border-radius:8px;margin-top:8px;padding:0 12px 8px}
.acc summary,#ned summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}
.ck{display:flex;gap:8px;align-items:center;min-height:40px}
.ck input{width:auto;min-height:0}
.gt2{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin-top:8px}
.pr{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--ln)}
.pr:last-child{border:0}
.pr select{width:auto;min-width:130px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:8px 16px;display:flex;gap:8px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ac);margin-right:auto;white-space:nowrap;min-width:0}
.brand .lg{background:#1B2A4A;border-radius:8px;padding:4px 7px;display:inline-flex;flex:none}.brand .lg img{height:26px;width:auto;display:block}
.ib{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;min-height:42px;border:1px solid var(--ln);border-radius:10px;background:transparent;color:var(--tx);text-decoration:none;font-weight:500;font-size:.9rem}
.ib:hover{border-color:var(--ac)}.ib svg{width:18px;height:18px;flex:none}
@media (max-width:520px){.ib span{display:none}.ib{padding:8px 11px}}
.hero{margin:8px 0 2px}.hi{font-size:1.5rem;margin:12px 0 2px}
.srch{position:relative;margin-top:14px}
.srch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mu);pointer-events:none}
.srch input[type=search]{padding:12px 14px 12px 44px;min-height:50px;font-size:1rem;border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.gt{margin:26px 0 0;font-size:1rem;font-weight:700;color:var(--tx)}
.alert{margin-top:18px;border:2px solid var(--er);padding:14px 16px}
.alert h2{color:var(--er);margin:0 0 4px;display:flex;align-items:center;gap:8px;font-size:1.05rem}
.alert h2 svg{width:20px;height:20px;flex:none}
.tile{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;text-align:left;min-height:112px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-decoration:none;color:inherit}
.tile:hover{border-color:var(--ac)}.tile:active{transform:scale(.98)}
.tile.hot{border-color:var(--er)}.tile.mod{border-color:var(--ac2)}
.ico{width:40px;height:40px;border-radius:10px;background:var(--bg);color:var(--ac);display:grid;place-items:center;margin-bottom:6px;flex:none}
.ico svg{width:22px;height:22px}
.tn{font-weight:700;font-size:1.02rem;line-height:1.25}
.ts{font-size:.82rem;color:var(--mu);display:flex;align-items:center;gap:4px}.ts svg{width:13px;height:13px;flex:none}
.pill{display:inline-block;margin-top:4px;padding:2px 9px;border-radius:99px;font-size:.76rem;font-weight:700;background:var(--er);color:var(--bg)}
.pill.am{background:var(--ac2);color:#14213D}
.res{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);padding:11px 0;min-height:52px;text-decoration:none;color:inherit}
.res:last-child{border-bottom:0}
.res .ico{width:36px;height:36px;margin:0}.res .ico svg{width:20px;height:20px}
.res .rt{flex:1;min-width:0}.res .rt b{display:block}
.res .rt .mu{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .go{width:18px;height:18px;color:var(--mu);flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;min-height:42px;border:1px solid var(--ln);border-radius:99px;background:var(--sf);font-weight:500}
.chip:hover{border-color:var(--ac)}.chip svg{width:16px;height:16px;color:var(--ac);flex:none}
details.adm{margin-top:28px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);padding:0 14px}
details.adm summary{cursor:pointer;min-height:50px;display:flex;align-items:center;gap:8px;font-weight:700}
details.adm summary svg{width:18px;height:18px;color:var(--mu)}
.emp{margin-top:24px;text-align:center;padding:32px 16px}
.lgb{background:#1B2A4A;border-radius:12px;padding:8px 12px;display:inline-flex;margin-bottom:12px}.lgb img{height:52px;width:auto;display:block}
.ov2{position:fixed;inset:0;background:rgba(10,16,30,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg2{max-width:420px;width:100%}.dact2{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app"></div>
<div class="clock" id="clock" aria-live="off"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,collection,onSnapshot,setDoc,updateDoc,deleteDoc,addDoc,getDoc,serverTimestamp,logEvento,svuotaCodaStorico} from "./fsx.js";
import {assicuraCoppia} from "./cifra.js";

import {firebaseConfig} from "./firebase-config.js";
import {inScadenza} from "./scadenze.js";
import {testDaFare,eventoInScadenza,tesseraAlert} from "./atleti-scadenze.js";
import {archiviato,zona,archiviaScaduti} from "./conservazione.js";

/* Home organizzata per gruppi. SEC (elenco piatto) resta la base di permessi, ricerca e tabella account */
const GROUPS=[['Documenti e archivio',['Documenti','File importanti','Documenti in scadenza','Archivio','Cestino']],['Persone',['Tecnici','Atleti','Tessere']],['Attività',['Lezioni','Eventi','Ordini']],['Media',['Video','Foto']],['Amministrazione',['Commercialista']],['Comunicazione',['Mail']]];
const SEC=GROUPS.flatMap(g=>g[1]);
const key=s=>s.toLowerCase().replace(/\s+/g,'-');
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Icone a linea (24x24), tutte decorative: accanto c'è sempre il testo */
const P={
 documenti:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
 'file-importanti':'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
 'documenti-in-scadenza':'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
 archivio:'<polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/>',
 tecnici:'<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/>',
 atleti:'<circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/>',
 tessere:'<rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/>',
 ordini:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.5L21 8H6"/>',
 lezioni:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
 eventi:'<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
 video:'<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>',
 foto:'<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
 commercialista:'<rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="11" x2="8.01" y2="11"/><line x1="12" y1="11" x2="12.01" y2="11"/><line x1="16" y1="11" x2="16.01" y2="11"/><line x1="8" y1="15" x2="8.01" y2="15"/><line x1="12" y1="15" x2="12.01" y2="15"/><line x1="16" y1="15" x2="16.01" y2="15"/><line x1="8" y1="18" x2="8.01" y2="18"/><line x1="12" y1="18" x2="16" y2="18"/>',
 mail:'<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>',
 chat:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
 user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
 out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
 search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
 go:'<polyline points="9 18 15 12 9 6"/>',
 alert:'<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
 lock:'<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
 notifiche:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
 cestino:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
 storico:'<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
 backup:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
 tool:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>'
};
const ic=(n,c='')=>`<svg${c?` class="${c}"`:''} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${P[n]||''}</svg>`;
let fa,auth,db,uid=null,me=null,accounts=[],items={},view='home',q='',unsubs=[],unsubUsers=null,unsubMe=null;
let msgAcc='',msgNew='',newMail='',newExtra='';
let accReg={},accRegOk=false,allineaT=null;const inVolo=new Map();     /* elenco cifrato degli account su Telegram (argomento «Account»): attivi e rimossi */
const page=s=>key(s)+'.html';
/* 'u' = "Solo dati utente" (solo Atleti): nessun accesso ai dati degli altri, vede soltanto la propria scheda. Per i dati vale come 'n'. */
const perm=s=>{if(!me)return 'n';if(me.admin)return 'w';const v=(me.perms||{})[key(s)]||'n';return v==='u'?'n':v};
const solo=s=>!!me&&!me.admin&&(me.perms||{})[key(s)]==='u';
const allItems=()=>SEC.filter(s=>s!=='Cestino').flatMap(s=>(items[key(s)]||[]).map(i=>({...i,sec:s}))).filter(i=>!i.lesson&&!i.evento&&(!i.tesAtl||i.archiviatoIl)&&(!i.archiviatoIl||perm('Archivio')!=='n')).map(i=>i.archiviatoIl?{...i,sec:'Archivio'}:i);
/* File importanti = documenti con la stella (da Documenti) + eventuali voci inserite a mano; Lezioni = solo le lezioni, senza i file allegati */
const count=s=>{const k=key(s),its=items[k]||[];
  if(k==='file-importanti')return (items.documenti||[]).filter(i=>i.star).length+its.length;
  if(k==='documenti')return its.filter(i=>!i.archiviatoIl).length;
  if(k==='archivio')return [...(items.documenti||[]),...(items.tessere||[])].filter(archiviato).length;
  if(k==='documenti-in-scadenza')return (items.documenti||[]).filter(inScadenza).length;
  if(k==='lezioni')return its.filter(i=>i.kind!=='file').length;
  if(k==='eventi')return its.filter(i=>i.kind==='evento').length;
  if(k==='tessere')return its.filter(i=>i.kind==='tessera').length;
  if(k==='ordini')return its.filter(i=>i.kind==='prodotto').length;
  if(k==='cestino')return its.filter(i=>me.admin||['r','w'].includes((me.perms||{})[i.sec])).length;
  return its.length};

if(firebaseConfig.apiKey==='INSERISCI'){app.innerHTML=box('Firebase non ancora collegato','Apri index.html e incolla i dati del progetto Firebase in firebaseConfig. Poi ricarica la pagina.')}
else{fa=initializeApp(firebaseConfig);auth=getAuth(fa);db=getFirestore(fa);
  onAuthStateChanged(auth,u=>{cleanup();uid=u?u.uid:null;me=null;if(!u){loginView();return}
    unsubMe=onSnapshot(doc(db,'users',uid),sn=>{me=sn.exists()?{id:uid,...sn.data()}:null;onMe()},()=>{app.innerHTML=box('Errore di connessione','Impossibile leggere l’account. Riprova tra poco.')})})}

function box(t,m,extra=''){return`<div class="wrap"><div class="card login"><span class="lgb"><img src="logo-yanagi.png" alt="Yanagi Academy"></span><h1>ProFile Manager</h1><h2 style="margin-top:12px">${esc(t)}</h2><div class="mu">${esc(m)}</div>${extra}</div></div>`}
function cleanup(){mio=false;mioTec=false;mioN=0;modN=0;ricN=0;ordN=0;bk=undefined;setupFatto=false;unsubs.forEach(f=>f());unsubs=[];if(unsubMe)unsubMe();if(unsubUsers)unsubUsers();unsubMe=unsubUsers=null;items={};accounts=[];accReg={};accRegOk=false}
let mio=false,mioTec=false,mioN=0,modN=0,ricN=0,ordN=0,bk;     /* bk: ultimo backup (solo admin): undefined = non ancora letto, null = mai fatto, numero = millisecondi */
let setupFatto=false;
const nomeAcc=id=>{const a=accounts.find(z=>z.id===id);return a?(a.name||a.email||id):id};
/* atleta con tessera: l'email dell'account coincide con quella inserita dall'admin nella scheda Atleti */
function cercaMio(){const e=auth.currentUser&&auth.currentUser.email;if(!e)return;getDoc(doc(db,'atletiEmail',e.toLowerCase())).then(s=>{const n=s.exists()?((s.data().atleti||[]).length||1):0;if(s.exists()!==mio||n!==mioN){mio=s.exists();mioN=n;render()}}).catch(()=>{});
  getDoc(doc(db,'tecniciEmail',e.toLowerCase())).then(s=>{if(s.exists()!==mioTec){mioTec=s.exists();render()}}).catch(()=>{})}
function onMe(){
  unsubs.forEach(f=>f());unsubs=[];if(unsubUsers){unsubUsers();unsubUsers=null}
  if(!me){app.innerHTML=box('Account non abilitato','Hai effettuato l’accesso ma un admin deve ancora abilitarti.','<p><button class="btn ghost" id="out">Esci</button></p>');$('#out').onclick=()=>signOut(auth);return}
  SEC.forEach(s=>{if(perm(s)!=='n')unsubs.push(onSnapshot(collection(db,'sections',key(s),'items'),sn=>{items[key(s)]=sn.docs.map(d=>({id:d.id,...d.data()}));if(key(s)==='documenti'&&perm('Documenti')==='w')archiviaScaduti(db,items.documenti);render()},()=>{}))});
  /* admin: quante schede atleta hanno modifiche proposte dall'atleta (riquadro Atleti con bordo giallo) */
  if(me.admin)unsubs.push(onSnapshot(collection(db,'atletiModifiche'),sn=>{modN=sn.docs.filter(d=>Object.keys(d.data().campi||{}).length).length;render()},()=>{modN=0}));
  /* ordini nuovi degli atleti: li vede chi ha Ordini in lettura o scrittura */
  if(me.admin||['r','w'].includes((me.perms||{}).ordini))unsubs.push(onSnapshot(collection(db,'ordiniInviati'),sn=>{ordN=sn.docs.filter(d=>d.data().stato==='inviato').length;render()},()=>{ordN=0}));
  /* admin: file e dati caricati da atleti e tecnici in attesa di approvazione (pagina Richieste) */

  app.innerHTML=topbar()+`<div class="wrap"><div class="bar"><button class="btn ghost sm" id="bk">Indietro</button><h2>Gestione account</h2></div>
  <div class="card"><h2 style="margin:0">Account (${accounts.length})</h2>
  ${accounts.map(a=>`<div class="acc"><div class="acc-h"><div><b>${esc(a.name||'—')}</b><div class="mu">${esc(a.email||'')}</div></div><div class="acc-a"><label class="ck"><input type="checkbox" data-a="${esc(a.id)}" ${a.admin?'checked':''}> Admin</label><button class="btn ghost sm" data-ed="${esc(a.id)}">Modifica</button><button class="btn ghost sm" data-pw="${esc(a.id)}">Password</button><button class="btn ghost sm" data-x="${esc(a.id)}">Rimuovi</button></div></div>${editorHtml(a.id,a.perms,!!a.admin)}</div>`).join('')}
  <p class="err" id="er2" role="alert"></p><p class="mu">Gli admin hanno sempre scrittura su tutte le schede. Per impostare schede e permessi specifici, togli prima il ruolo admin. “Rimuovi” revoca l’accesso ma il login resta: per riattivare la stessa email basta crearla di nuovo (se non ricordi la sua password, l’app ti offre di inviare il link per sceglierne una nuova). Per cancellare del tutto il login usa la console Firebase.</p></div>
  ${rimossiHtml()}
  <div class="card" style="margin-top:12px"><h2>Nuovo account</h2><label for="nn2" style="margin-top:0">Nome</label><input id="nn2" type="text"><label for="ne">Email</label><input id="ne" type="text" autocomplete="off"><label for="np">Password iniziale (min. 6 caratteri)</label><input id="np" type="password" autocomplete="new-password"><label class="ck" style="margin-top:8px"><input type="checkbox" id="na"> Admin</label><div id="ned" style="margin-top:4px"></div><p class="err" id="er" role="alert"></p><button class="btn" id="cr">Crea account</button></div></div>`;
  $('#nn2').value=keep[0];$('#ne').value=keep[1];$('#np').value=keep[2];$('#na').checked=keepA;
  if(msgAcc)$('#er2').textContent=msgAcc;if(msgNew){$('#er').innerHTML=msgNew;bindRst()}
  paintNew();bindEd(app);$('#na').onchange=paintNew;
  bindTop();$('#bk').onclick=()=>{view='home';render()};
  document.querySelectorAll('[data-a]').forEach(c=>c.onchange=()=>{if(!c.checked&&adminsLeft<2){c.checked=true;$('#er2').textContent='Deve restare almeno un admin.';return}updateDoc(doc(db,'users',c.dataset.a),{admin:c.checked}).then(()=>logEvento('account','',c.dataset.a,nomeAcc(c.dataset.a),c.checked?'reso admin':'tolto il ruolo admin')).catch(()=>{})});
  document.querySelectorAll('[data-pw]').forEach(b=>b.onclick=async()=>{const a=accounts.find(z=>z.id===b.dataset.pw);if(!a||!a.email)return;if(confirm('Inviare a '+a.email+' il link per scegliere una nuova password?'))mAcc((await inviaResetA(a.email)).t)});
  document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const a=accounts.find(z=>z.id===b.dataset.ed);if(a)modificaAccount(a)});
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const a=accounts.find(z=>z.id===b.dataset.x);if(a.admin&&adminsLeft<2){$('#er2').textContent='Non puoi rimuovere l’ultimo admin.';return}if(!confirm('Revocare l’accesso a '+(a.name||a.email)+'? Potrai riattivarlo dall’elenco «Account rimossi».'))return;(async()=>{try{await setDoc(doc(db,'sections','account','items',a.id),{...schedaReg(a,'rimosso'),rimossoIl:Date.now()})}catch(e){console.warn('Elenco account:',e&&e.message)}
    deleteDoc(doc(db,'users',a.id)).then(()=>logEvento('account','',a.id,a.name||a.email||a.id,'accesso revocato')).catch(()=>{})})()});
  document.querySelectorAll('[data-ri]').forEach(b=>b.onclick=async()=>{const r=accReg[b.dataset.ri];if(!r)return;
    if(!confirm('Riattivare '+(r.name||r.email)+(r.admin?' (era admin)':'')+' con i permessi che aveva?'))return;
    try{await setDoc(doc(db,'users',b.dataset.ri),{name:r.name||'',email:r.email||'',admin:!!r.admin,perms:{...(r.perms||{})}});logEvento('account','',b.dataset.ri,r.name||r.email,'account riattivato');mAcc('Account riattivato: entra con la sua vecchia password. Se non la ricorda, usa «Password» accanto al suo nome per inviargli il link.')}
    catch(x){console.error(x);mAcc('Riattivazione non riuscita. Riprova.')}});
  document.querySelectorAll('[data-lk]').forEach(b=>b.onclick=async()=>{const r=accReg[b.dataset.lk];if(r)mAcc((await inviaResetA(r.email)).t)});
  document.querySelectorAll('[data-df]').forEach(b=>b.onclick=async()=>{const r=accReg[b.dataset.df];if(!r)return;
    if(!confirm('Togliere '+(r.name||r.email)+' dall’elenco dei rimossi? Non potrai più riattivarlo con un clic (potrai comunque ricrearlo con la sua password).'))return;
    try{await deleteDoc(doc(db,'sections','account','items',b.dataset.df))}catch(x){mAcc('Operazione non riuscita. Riprova.')}});
  $('#cr').onclick=async()=>{const n=$('#nn2').value.trim(),e=$('#ne').value.trim().toLowerCase(),p=$('#np').value,er=$('#er');mNew('');
    const rim=rimossi().find(([,r])=>String(r.email||'').toLowerCase()===e.toLowerCase());
    if(!n||!e||(!rim&&p.length<6)){er.textContent='Inserisci nome, email e una password di almeno 6 caratteri.';return}
    const registra=async(uid,msg)=>{
      await setDoc(doc(db,'users',uid),{name:n,email:e,admin:$('#na').checked,perms:$('#na').checked?{}:{...newPerms}});
      logEvento('account','',uid,n,msg+($('#na').checked?' (admin)':''));
      $('#nn2').value=$('#ne').value=$('#np').value='';$('#na').checked=false;newPerms={};paintNew()};
    if(rim){try{await registra(rim[0],'account riattivato');mNew('Esisteva già un account rimosso con questa email: è stato <b>riattivato</b> con nome e permessi che hai scelto. Entra con la sua vecchia password; se non la ricorda, <button class="btn ghost sm" id="rst" type="button">invia il link per sceglierne una nuova</button>.',e)}catch(x){console.error(x);er.textContent='Riattivazione non riuscita. Riprova.'}return}
    try{const sec=initializeApp(firebaseConfig,'sec'+Date.now()),sa=getAuth(sec);
      const c=await createUserWithEmailAndPassword(sa,e,p);const nid=c.user.uid;await signOut(sa);
      await registra(nid,'account creato');mNew('');
    }catch(x){
      if(x.code!=='auth/email-already-in-use'){er.textContent='Creazione non riuscita. Controlla i dati e riprova.';return}
      /* il login esiste già (di solito un account rimosso in precedenza: «Rimuovi» toglie i permessi ma non il login): se la password è quella giusta lo si riattiva */
      try{
        const sa=getAuth(initializeApp(firebaseConfig,'sec'+Date.now())),c=await signInWithEmailAndPassword(sa,e,p),uid=c.user.uid;await signOut(sa);
        if(accounts.some(z=>z.id===uid)){er.textContent='Questo account è già attivo: lo trovi nell’elenco qui sopra.';return}
        await registra(uid,'account riattivato');mNew('Account riattivato: la password è quella che aveva già.')
      }catch(y){
        mNew('Esiste già un login con questa email (probabilmente un account rimosso in precedenza) e la password inserita non è quella giusta. Se ricordi la vecchia password, inseriscila e riprova. Altrimenti <button class="btn ghost sm" id="rst" type="button">invia a questa email il link per scegliere una nuova password</button>, poi torna qui e inserisci la nuova password.',e,'Poi inserisci qui la nuova password e premi di nuovo «Crea account».')}}};
}
/* Correzione del nome di un account (l'email di accesso non si può cambiare da qui: se è sbagliata si rimuove e si ricrea con quella giusta) */
function modificaAccount(a){
  const o=document.createElement('div');o.className='ov2';
  o.innerHTML=`<div class="card dlg2" role="dialog" aria-modal="true" aria-label="Modifica account"><h2 style="margin:0 0 8px">Modifica account</h2><label for="mn" style="margin-top:0">Nome</label><input id="mn" type="text" value="${esc(a.name||'')}" autocomplete="off"><p class="mu" style="margin:8px 0 0">Email di accesso: <b>${esc(a.email||'')}</b>. Non si cambia da qui: se è sbagliata, usa «Rimuovi» e crea un nuovo account con l’email giusta.</p><p class="err" id="mer" role="alert"></p><div class="dact2"><button class="btn ghost" id="mx">Annulla</button><button class="btn" id="ms">Salva</button></div></div>`;
  document.body.append(o);const i=o.querySelector('#mn');i.focus();i.select();
  const close=()=>o.remove();
  o.querySelector('#mx').onclick=close;o.onclick=e=>{if(e.target===o)close()};
  o.onkeydown=e=>{if(e.key==='Escape')close();else if(e.key==='Enter')o.querySelector('#ms').click()};
  o.querySelector('#ms').onclick=async()=>{const n=i.value.trim(),er=o.querySelector('#mer');
    if(!n){er.textContent='Il nome non può essere vuoto.';return}
    if(n===(a.name||'')){close();return}
    try{await updateDoc(doc(db,'users',a.id),{name:n});logEvento('account','',a.id,n,'nome modificato (era «'+(a.name||'')+'»)');close()}
    catch(x){console.error(x);er.textContent='Salvataggio non riuscito. Riprova.'}}}
function tick(){const d=new Date();$('#clock').textContent=d.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'long',year:'numeric'})+' · '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}
tick();setInterval(tick,15000);
</script>
</body>
