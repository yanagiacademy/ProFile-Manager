<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Richieste – ProFile Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stile.css">
<style>
.hd{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.lgbox{background:#1B2A4A;border-radius:12px;padding:8px 12px;display:inline-flex;flex:none}
.lgbox img{height:84px;width:auto;display:block}
.hd .grow{flex:1 1 auto;min-width:0}
.hbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
input[type=date]{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);min-height:44px}
textarea{width:100%;min-height:70px;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);resize:vertical}
fieldset{border:1px solid var(--ln);border-radius:10px;margin:12px 0 0;padding:2px 14px 14px}
legend{padding:0 6px;font-weight:700;font-size:.9rem;color:var(--ac)}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.flt select{width:auto;min-height:40px}
.tr{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);padding:10px 2px}
.tr:last-child{border:0}
.tr.alarm{border-left:4px solid var(--er);padding-left:8px}
.tr .inf{flex:1 1 auto;min-width:0;line-height:1.3}
.tr .inf>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:50%}
.chip{font-size:.72rem;padding:2px 8px;border-radius:99px;border:1px solid var(--ln);white-space:nowrap;color:var(--mu)}
.chip.bad{border-color:var(--er);background:var(--er);color:var(--bg);font-weight:700}
.chip.ok{border-color:var(--ac);color:var(--tx)}
.dl h3{margin:14px 0 4px;font-size:.85rem;color:var(--ac);text-transform:uppercase;letter-spacing:.04em}
.dl dl{margin:0;display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:4px 10px;font-size:.92rem}
.dl dt{color:var(--mu)}
.dl dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.dlg.big{max-width:600px}
.dact{flex-wrap:wrap}
.fh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gr{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:99px;background:var(--ac);color:var(--bg);margin-left:6px;vertical-align:1px}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.ocr{font-size:.85rem;margin-top:6px;color:var(--mu)}
.fld{border-top:1px solid var(--ln);padding:10px 0}
.fld .fl{font-weight:700;font-size:.9rem}
.pd{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;margin:6px 0;font-size:.92rem}
.pd>div{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.pd .ar{color:var(--mu);padding-top:18px}
.pd .dp>div:last-child{font-weight:700}
@media (max-width:480px){.pd{grid-template-columns:1fr}.pd .ar{padding:0;transform:rotate(90deg);width:20px}}
.fbox{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin:8px 0}
.err{color:var(--er)}
</style>
</head>
<body>
<div id="app"></div>
<div id="memo"></div>
<div class="clock" id="clock"></div>
<script type="module" src="richieste-pagina.js"></script>
</body>
</html>
