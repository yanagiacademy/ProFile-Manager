<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lezioni – ProFile Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stile.css">
<style>
.fh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hd{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.lgbox{background:#1B2A4A;border-radius:12px;padding:8px 12px;display:inline-flex;flex:none}
.lgbox img{height:84px;width:auto;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=date]{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);min-height:44px}
input[readonly]{background:transparent;color:var(--mu)}
textarea{width:100%;min-height:170px;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);resize:vertical}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.les{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--ln)}
.les:last-child{border:0}
.strip{display:flex;gap:6px;align-items:center;flex:none}
.tile{position:relative;width:64px;height:64px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1.7rem;flex:none;cursor:pointer}
.tile.ls{background:#1B2A4A;border-color:#1B2A4A}
.tile img.lg{height:42px;width:auto;margin-bottom:10px}
.tile img.th{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .cp{position:absolute;left:0;right:0;bottom:0;font-size:.62rem;line-height:1.3;background:rgba(0,0,0,.6);color:#fff;text-align:center;padding:1px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arw{width:32px;height:44px;border:1px solid var(--ln);border-radius:8px;background:transparent;color:var(--tx);font-size:1.3rem;line-height:1;cursor:pointer;flex:none}
.arw:disabled{opacity:.35;cursor:default}
.inf{flex:1 1 150px;min-width:0}
.les .dt{font-weight:700}
.les .bt{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app"></div>
<div id="prog" role="status"></div>
<div id="memo"></div>
<div class="clock" id="clock"></div>
<script type="module" src="lezioni.js"></script>
</body>
</html>
