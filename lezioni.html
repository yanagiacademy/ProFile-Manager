<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lezioni – ProFile Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stile.css">
<style>
.fh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.oa{border-top:1px solid var(--ln)}.oa:first-child{border-top:0}
.oh{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:12px 2px;min-height:48px}
.oh .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oh .hr{font-weight:700;white-space:nowrap}
.od{padding:0 2px 10px 12px;font-size:.9rem}.od .fh{padding:5px 0;border-top:1px dashed var(--ln);align-items:flex-start}
.hd{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.lgbox{background:#1B2A4A;border-radius:12px;padding:8px 12px;display:inline-flex;flex:none}
.lgbox img{height:84px;width:auto;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=date]{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);min-height:44px}
input[readonly]{background:transparent;color:var(--mu)}
textarea{width:100%;min-height:170px;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);resize:vertical}
.acts{display:flex;flex-direction:row;gap:8px;flex-wrap:wrap;margin-top:12px}
.les{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;padding:4px 0;border-bottom:1px solid var(--ln)}
.les:last-child{border:0}
.strip{display:flex;gap:3px;align-items:center;flex:none}
.lt{position:relative;width:28px;height:28px;border-radius:6px;border:1px solid var(--ln);background:var(--bg);padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1rem;flex:none;cursor:pointer}
.lt.ls{background:#1B2A4A;border-color:#1B2A4A}
.lt img.lg{height:20px;width:auto}
.lt img.th{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lt .cp{display:none}
.arw{width:16px;height:28px;border:1px solid var(--ln);border-radius:6px;background:transparent;color:var(--tx);font-size:1rem;line-height:1;cursor:pointer;flex:none;padding:0}
.arw:disabled{opacity:.35;cursor:default}
.inf{flex:1 1 auto;min-width:0;font-size:.76rem;line-height:1.25}
#ls{padding:4px 8px}
.inf>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mn{flex:none;min-width:24px;height:28px;padding:0 2px}
.mnu-ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:10px}
.mnu{width:100%;max-width:420px}
.mnu .acts{flex-direction:column}
.dd{border:1px solid var(--ln);border-radius:10px;background:var(--bg)}
.dd summary{cursor:pointer;padding:10px 12px;min-height:44px;box-sizing:border-box;display:flex;align-items:center}
.ddp{padding:8px 10px;border-top:1px solid var(--ln)}
#prl{max-height:240px;overflow:auto;margin-top:8px}
.ck{display:flex;gap:8px;align-items:center;padding:6px 2px;min-height:36px}
.ck input{width:auto;min-height:0}
@media(max-width:560px){.two{grid-template-columns:1fr}}
</style>
<script src="tema.js"></script>
</head>
<body>
<div id="app"></div>
<div id="prog" role="status"></div>
<div id="memo"></div>
<div class="clock" id="clock"></div>
<script type="module" src="lezioni.js"></script>
</body>
</html>
