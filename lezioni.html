<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lezioni – ProFile Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stile.css">
<style>
.fh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hd{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.lgbox{background:#1B2A4A;border-radius:12px;padding:8px 12px;display:inline-flex;flex:none}
.lgbox img{height:84px;width:auto;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=date]{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);min-height:44px}
input[readonly]{background:transparent;color:var(--mu)}
textarea{width:100%;min-height:170px;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);resize:vertical}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.les{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;padding:4px 0;border-bottom:1px solid var(--ln)}
.les:last-child{border:0}
.strip{display:flex;gap:4px;align-items:center;flex:none}
.tile{position:relative;width:30px;height:30px;border-radius:6px;border:1px solid var(--ln);background:var(--bg);padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1rem;flex:none;cursor:pointer}
.tile.ls{background:#1B2A4A;border-color:#1B2A4A}
.tile img.lg{height:20px;width:auto}
.tile img.th{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .cp{display:none}
.arw{width:22px;height:30px;border:1px solid var(--ln);border-radius:6px;background:transparent;color:var(--tx);font-size:1rem;line-height:1;cursor:pointer;flex:none;padding:0}
.arw:disabled{opacity:.35;cursor:default}
.inf{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.88rem}
.mn{flex:none;min-width:30px;height:30px;padding:0 6px}
.mnu-ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:10px}
.mnu{width:100%;max-width:420px}
.mnu .acts{flex-direction:column}
</style>
</head>
<body>
<div id="app"></div>
<div id="prog" role="status"></div>
<div id="memo"></div>
<div class="clock" id="clock"></div>
<script type="module" src="lezioni.js"></script>
</body>
</html>
