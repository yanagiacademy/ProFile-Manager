<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eventi – ProFile Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stile.css">
<style>
.fh{display:flex;justify-content:space-between;align-items:center;gap:6px 8px;flex-wrap:wrap}
.hd{display:flex;gap:6px 12px;align-items:center;margin-bottom:12px;flex-wrap:wrap;min-width:0}
.lgbox{background:#1B2A4A;border-radius:10px;padding:6px 10px;display:inline-flex;flex:none}
.lgbox img{height:60px;width:auto;display:block}
.hd .grow{flex:1 1 auto;min-width:0}
.hbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
input[type=date],input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);min-height:44px}
textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);resize:vertical}
fieldset{border:1px solid var(--ln);border-radius:10px;margin:14px 0 0;padding:2px 14px 14px}
legend{padding:0 6px;font-weight:700;font-size:.9rem;color:var(--ac)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border:1px solid var(--ln);background:none;border-radius:99px;padding:6px 14px;min-height:40px;color:var(--tx)}
.tabs button[aria-pressed=true]{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:700}
.dtabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.dtabs button{flex:0 0 auto;white-space:nowrap;border:1px solid var(--ln);background:none;border-radius:99px;padding:6px 14px;min-height:40px;color:var(--tx)}
.dtabs button[aria-selected=true]{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:700}
.sep{margin:12px 0 2px;font-size:.8rem;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.tr{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);padding:10px 2px}
.tr:last-child{border:0}
.tr.past{opacity:.65}
.tr .inf{flex:1 1 auto;min-width:0;line-height:1.3}
.tr .inf>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:46%}
.chip{font-size:.72rem;padding:2px 8px;border-radius:99px;border:1px solid var(--ln);white-space:nowrap;color:var(--mu)}
.chip.bad{border-color:var(--er);background:var(--er);color:var(--bg);font-weight:700}
.chip.warn{border-color:var(--ac2);color:var(--tx);font-weight:700}
.chip.ok{border-color:var(--ac);color:var(--tx)}
.dl h3{margin:14px 0 4px;font-size:.85rem;color:var(--ac);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dl dl{margin:0;display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:4px 10px;font-size:.92rem}
.dl dt{color:var(--mu)}
.dl dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.dlg.big{max-width:600px}
.sel{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.sel .btn{flex:1 1 140px}
.ir{border-bottom:1px solid var(--ln);padding:8px 0;font-size:.92rem}
.ir:last-child{border:0}
.ir .l1{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.ir .l2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.kpi{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.kpi span{border:1px solid var(--ln);border-radius:10px;padding:4px 10px;font-size:.85rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:6px 0 12px}
.tiles div{border:1px solid var(--ln);border-radius:12px;padding:8px 6px;text-align:center}
.tiles b{display:block;font-size:1.3rem;line-height:1.2;overflow-wrap:anywhere}
.tiles small{color:var(--mu);font-size:.74rem}
.tiles .hot{border-color:var(--ac2);border-width:2px}
details.sez{border:1px solid var(--ln);border-radius:12px;margin:10px 0;padding:0 12px}
details.sez>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;font-weight:700;min-height:44px}
details.sez>summary::-webkit-details-marker{display:none}
details.sez>summary .t{flex:1 1 auto}
details.sez>summary::after{content:'▾';color:var(--mu);flex:none}
details.sez:not([open])>summary::after{content:'▸'}
details.sez .sub{color:var(--mu);font-size:.82rem;margin:-4px 0 6px}
details.sez .corpo{padding-bottom:6px}
.fr{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:4px 0}
.xb{background:none;border:1px solid var(--ln);border-radius:8px;min-height:40px;min-width:40px}
.tr.alarm{border-left:2px solid var(--er);padding-left:8px}
.tr.off{opacity:.75}
.dact{flex-wrap:wrap}
.pay{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem}
.ck{display:flex;gap:8px;align-items:center;min-height:40px;margin:0;color:var(--tx);font-size:.95rem}
.ck input{width:auto;min-height:0}
.dlst{max-height:260px;overflow:auto;border:1px solid var(--ln);border-radius:8px;padding:2px 10px;margin-top:4px;background:var(--bg)}
.cam{position:relative;background:#000;border-radius:10px;overflow:hidden;display:none;margin-top:8px}
.cam video{width:100%;max-height:44vh;object-fit:cover;display:block}
.es{border:2px solid var(--ln);border-radius:10px;padding:10px 12px;margin:10px 0;min-height:64px}
.es.ok{border-color:var(--ac)}.es.dup{border-color:var(--ac2)}.es.ko{border-color:var(--er)}
.fr input[type=text]{flex:1 1 auto;min-width:0}
</style>
<script src="tema.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EEF1F4">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="pwa-init.js" defer></script>
</head>
<body>
<div id="app"></div>
<div id="memo"></div>
<div class="clock" id="clock"></div>
<script type="module" src="eventi.js"></script>
</body>
</html>
