<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archivio – ProFile Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stile.css">
<style>
.th{display:block;width:100%;height:72px;object-fit:cover;border-radius:6px;background:#fff}
.fi .th{width:36px;height:36px;border-radius:5px}
.frow{flex-wrap:wrap}
.frow .fi{width:auto;min-width:1.8rem}
.frow .fn{flex:1 1 200px}
.sm2{font-size:.78rem}
.chip{font-size:.78rem;font-weight:700;padding:3px 12px;border-radius:99px;border:1px solid var(--ac2);white-space:nowrap}
.seg{margin-bottom:12px}
.seg button{flex:1}
.dlg select{width:100%}
</style>
</head>
<body>
<div id="app"></div>
<div id="prog" role="status"></div>
<div id="memo"></div>
<div class="clock" id="clock"></div>
<script type="module" src="archivio-pagina.js"></script>
</body>
</html>
